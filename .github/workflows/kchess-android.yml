name: K-Chess 앱 만들기

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'k-chess/**', '.github/workflows/kchess-android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 서명 키 준비
        env:
          KC_KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          if [ -n "$KC_KEYSTORE_BASE64" ]; then
            echo "$KC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "KC_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "KC_KEYSTORE_PASSWORD=$KC_KEYSTORE_PASSWORD"
              echo "KC_KEY_ALIAS=$KC_KEY_ALIAS"
              echo "KC_KEY_PASSWORD=$KC_KEY_PASSWORD"
              echo "KC_SIGNED=upload"
            } >> "$GITHUB_ENV"
          else
            # 업로드 키가 없으면 시험용 임시 키 (스토어 업로드 불가)
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.jks" -alias temp -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass "$PW" -keypass "$PW" -dname "CN=K-Chess Test" >/dev/null 2>&1
            echo "::add-mask::$PW"
            {
              echo "KC_KEYSTORE_FILE=$RUNNER_TEMP/temp.jks"
              echo "KC_KEYSTORE_PASSWORD=$PW"
              echo "KC_KEY_ALIAS=temp"
              echo "KC_KEY_PASSWORD=$PW"
              echo "KC_SIGNED=temp"
            } >> "$GITHUB_ENV"
          fi

      - name: APK와 AAB 빌드
        run: gradle -p k-chess/android assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 파일 정리
        run: |
          cp k-chess/android/app/build/outputs/apk/release/app-release.apk k-chess.apk
          cp k-chess/android/app/build/outputs/bundle/release/app-release.aab k-chess.aab
          if [ "$KC_SIGNED" = "upload" ]; then
            echo "NOTE=✅ 업로드 키로 서명됨 — k-chess.aab 를 Play Console에 올릴 수 있어요." >> "$GITHUB_ENV"
          else
            echo "NOTE=⚠️ 시험용 임시 키로 서명됨 — APK 설치 시험용이에요. 스토어에 올리려면 업로드 키(Secrets)를 먼저 설정하세요." >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: k-chess
          path: |
            k-chess.apk
            k-chess.aab

      - name: Release에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kchess-v1.0.${{ github.run_number }}
          name: K-Chess v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            ♟️ **K-Chess (케이체스)** — 전래 동화 체스
            • **k-chess.apk** : 휴대폰에 바로 설치해서 시험해 보는 파일
            • **k-chess.aab** : Google Play Console에 올리는 파일
            ${{ env.NOTE }}
          files: |
            k-chess.apk
            k-chess.aab
